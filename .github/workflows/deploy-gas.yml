name: Deploy GAS

on:
  push:
    branches: [main, develop]
    paths:
      - 'gas/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint GAS code
        run: npx eslint gas/*.gs

      # バージョンを固定する。
      #
      # 無指定だと npm がその時の最新を入れるので、clasp 側の破壊的変更で
      # ある日いきなり GAS デプロイが落ちる。しかも gas/ を変更したときしか
      # 動かないワークフローなので、壊れていることに気づくのは「直したい
      # ときに直せない」瞬間になる。
      #
      # 3.4.1 は 2026-08-28 公開で、最後に成功した 2026-08-30 のデプロイで
      # 実際に使われた版 (当時これが最新だった)。上げるときは gas/ に変更を
      # 含む PR で1回通してから固定値を書き換えること。
      - name: Install clasp
        run: npm install -g @google/clasp@3.4.1

      - name: Setup clasp credentials
        run: |
          echo '{
            "tokens": {
              "default": {
                "client_id": "1072944905499-vm2v2i5dvn0a0d2o4ca36i1vge8cvbn0.apps.googleusercontent.com",
                "client_secret": "v6V3fKV_zWU7iw1DrpO1rknX",
                "type": "authorized_user",
                "refresh_token": "${{ secrets.CLASP_REFRESH_TOKEN }}",
                "access_token": ""
              }
            }
          }' > ~/.clasprc.json

      - name: Push to GAS
        run: cd gas && clasp push

      - name: Deploy to production
        run: cd gas && clasp deploy -i AKfycbwYszp7P8kYlZabnLgUTCLUHqOZ-cBS1nv9umJp6NGXcyArT83PMJq_AfmEH3Pk_SshFg
